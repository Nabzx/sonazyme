<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <rect x="1" y="1" width="898" height="328" rx="11" fill="#0b0e14" stroke="#222831"/>

  <text x="450" y="30" text-anchor="middle" fill="#6b7280" font-size="12">sonazyme  ·  start at the biofilm, end at a variant that still folds in the loop</text>
  <line x1="0" y1="46" x2="900" y2="46" stroke="#191e27"/>

  <!-- pipe -->
  <rect x="40" y="70" width="820" height="86" fill="#0d1117" stroke="#2b3340" stroke-width="3"/>
  <text x="48" y="64" fill="#4b5261" font-size="11">direct-to-chip cooling loop</text>
  <text x="852" y="64" text-anchor="end" fill="#4b5261" font-size="11">assumed envelope: 45 to 55 °C, pH 8 to 9.5</text>

  <!-- coolant flow -->
  <g stroke="#1f6feb" stroke-width="1.5" opacity="0.8">
    <line x1="80" y1="92" x2="150" y2="92"/>
    <line x1="200" y1="92" x2="270" y2="92"/>
    <line x1="320" y1="92" x2="390" y2="92"/>
    <line x1="440" y1="92" x2="510" y2="92"/>
    <line x1="560" y1="92" x2="630" y2="92"/>
    <line x1="680" y1="92" x2="750" y2="92"/>
  </g>
  <path d="M770 92 l12 0 m-6 -5 l6 5 -6 5" stroke="#1f6feb" stroke-width="1.5" fill="none"/>
  <text x="800" y="96" fill="#1f6feb" font-size="11" opacity="0.9">coolant</text>

  <!-- biofilm on the inner wall -->
  <path d="M40 155 L860 155 L860 142 C800 136 760 148 700 142 C640 136 600 148 540 142 C480 136 440 148 380 142 C320 136 280 148 220 142 C160 136 110 148 40 142 Z"
        fill="#3f6212" opacity="0.9"/>
  <g fill="#84cc16" opacity="0.85">
    <circle cx="120" cy="149" r="2.2"/><circle cx="175" cy="151" r="1.9"/><circle cx="246" cy="148" r="2.2"/>
    <circle cx="310" cy="151" r="1.9"/><circle cx="398" cy="149" r="2.2"/><circle cx="470" cy="151" r="1.9"/>
    <circle cx="556" cy="148" r="2.2"/><circle cx="628" cy="151" r="1.9"/><circle cx="712" cy="148" r="2.2"/>
    <circle cx="790" cy="151" r="1.9"/>
  </g>
  <text x="48" y="174" fill="#65a30d" font-size="11">biofilm: polysaccharide and protein holding bacteria to the wall</text>

  <!-- stage chain -->
  <g font-size="11.5">
    <g>
      <rect x="40" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="92" y="234" text-anchor="middle" fill="#e5e7eb">sense</text>
      <text x="92" y="250" text-anchor="middle" fill="#6b7280" font-size="10">what holds it</text>
    </g>
    <g>
      <rect x="156" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="208" y="234" text-anchor="middle" fill="#e5e7eb">chassis</text>
      <text x="208" y="250" text-anchor="middle" fill="#6b7280" font-size="10">parent enzyme</text>
    </g>
    <g>
      <rect x="272" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="324" y="234" text-anchor="middle" fill="#e5e7eb">design</text>
      <text x="324" y="250" text-anchor="middle" fill="#6b7280" font-size="10">variants</text>
    </g>
    <g>
      <rect x="388" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="440" y="234" text-anchor="middle" fill="#e5e7eb">fold</text>
      <text x="440" y="250" text-anchor="middle" fill="#6b7280" font-size="10">structure</text>
    </g>
    <g>
      <rect x="504" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="556" y="234" text-anchor="middle" fill="#e5e7eb">score</text>
      <text x="556" y="250" text-anchor="middle" fill="#6b7280" font-size="10">stability</text>
    </g>
    <g>
      <rect x="620" y="214" width="104" height="48" rx="6" fill="#111722" stroke="#2b3340"/>
      <text x="672" y="234" text-anchor="middle" fill="#e5e7eb">rank</text>
      <text x="672" y="250" text-anchor="middle" fill="#6b7280" font-size="10">trade-offs</text>
    </g>
    <g>
      <rect x="736" y="214" width="124" height="48" rx="6" fill="#111722" stroke="#1f6feb"/>
      <text x="798" y="234" text-anchor="middle" fill="#e5e7eb">explain</text>
      <text x="798" y="250" text-anchor="middle" fill="#6b7280" font-size="10">why this one</text>
    </g>
    <g stroke="#2b3340" fill="none">
      <path d="M144 238 l12 0 m-6 -4 l6 4 -6 4"/>
      <path d="M260 238 l12 0 m-6 -4 l6 4 -6 4"/>
      <path d="M376 238 l12 0 m-6 -4 l6 4 -6 4"/>
      <path d="M492 238 l12 0 m-6 -4 l6 4 -6 4"/>
      <path d="M608 238 l12 0 m-6 -4 l6 4 -6 4"/>
      <path d="M724 238 l12 0 m-6 -4 l6 4 -6 4"/>
    </g>
  </g>

  <text x="40" y="294" fill="#4b5261" font-size="11">every stage writes to one run manifest: inputs, model version, score, artefact</text>
  <text x="860" y="294" text-anchor="end" fill="#4b5261" font-size="11">nothing here has been tested in a wet lab</text>
</svg>
