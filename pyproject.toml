[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonazyme"
version = "0.0.1"
description = "Enzymes designed to break down biofilm and to survive the cooling loop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nabil Shah" }]
# No runtime dependencies yet. The manifest format, the service clients and the
# scoring stack are M1 to M4 decisions and arrive with their ADRs.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sonazyme"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation/cases"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"validation/**" = ["D"]
"scripts/**" = ["D"]
