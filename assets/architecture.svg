<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4654"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="678" rx="12" fill="#0b0e14" stroke="#222831"/>
  <text x="500" y="30" text-anchor="middle" fill="#6b7280">sonazyme  ·  monitor, design, treat, monitor again</text>
  <line x1="0" y1="46" x2="1000" y2="46" stroke="#191e27"/>

  <!-- ============ 1. sense the loop ============ -->
  <text x="45" y="76" fill="#4b5261" font-size="11">1 · SENSE THE LOOP</text>

  <rect x="45" y="96" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
  <text x="104" y="117" text-anchor="middle" fill="#e5e7eb" font-size="11">reading</text>
  <text x="104" y="133" text-anchor="middle" fill="#6b7280" font-size="9">where the film is,</text>
  <text x="104" y="145" text-anchor="middle" fill="#6b7280" font-size="9">with uncertainty</text>

  <rect x="177" y="96" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
  <text x="236" y="117" text-anchor="middle" fill="#e5e7eb" font-size="11">target file</text>
  <text x="236" y="133" text-anchor="middle" fill="#6b7280" font-size="9">anchors, envelope,</text>
  <text x="236" y="145" text-anchor="middle" fill="#6b7280" font-size="9">sourced or assumed</text>

  <path d="M396 125 L303 125" stroke="#3d4654" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="400" y="88" width="556" height="72" fill="#0d1117" stroke="#2b3340" stroke-width="3"/>
  <rect x="432" y="72" width="62" height="16" rx="3" fill="#111722" stroke="#1f6feb"/>
  <text x="463" y="84" text-anchor="middle" fill="#1f6feb" font-size="9">transducer</text>

  <g stroke="#1f6feb" fill="none" opacity="0.75">
    <path d="M506 124 a22 22 0 0 1 0 -26"/>
    <path d="M522 130 a34 34 0 0 1 0 -38"/>
    <path d="M538 136 a46 46 0 0 1 0 -50"/>
  </g>
  <path d="M550 110 L636 110" stroke="#1f6feb" stroke-width="1.4" marker-end="url(#b)"/>
  <path d="M636 138 L550 138" stroke="#1f6feb" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#b)"/>
  <text x="593" y="104" text-anchor="middle" fill="#1f6feb" font-size="9">pulse</text>
  <text x="593" y="152" text-anchor="middle" fill="#1f6feb" font-size="9">echo, changed</text>

  <path d="M676 159 L952 159 L952 149 C916 141 886 153 850 146 C814 139 782 151 746 145 C722 141 700 149 676 147 Z" fill="#3f6212" opacity="0.9"/>
  <g fill="#84cc16" opacity="0.85">
    <circle cx="730" cy="153" r="2"/><circle cx="792" cy="151" r="2"/><circle cx="858" cy="152" r="2"/><circle cx="920" cy="150" r="2"/>
  </g>
  <text x="404" y="178" fill="#65a30d" font-size="10">biofilm building on the inner wall</text>

  <!-- inputs down into sense -->
  <path d="M104 158 L104 232" stroke="#3d4654" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M236 158 L236 196 L130 196 L130 232" stroke="#3d4654" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <!-- ============ 2. design ============ -->
  <text x="45" y="218" fill="#4b5261" font-size="11">2 · DESIGN</text>

  <g>
    <rect x="45" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="104" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">sense</text>
    <text x="104" y="276" text-anchor="middle" fill="#6b7280" font-size="9">what and where</text>

    <rect x="177" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="236" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">chassis</text>
    <text x="236" y="276" text-anchor="middle" fill="#6b7280" font-size="9">parent enzyme</text>

    <rect x="309" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="368" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">design</text>
    <text x="368" y="276" text-anchor="middle" fill="#8b5cf6" font-size="9">Tamarind Bio</text>

    <rect x="441" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="500" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">fold</text>
    <text x="500" y="276" text-anchor="middle" fill="#8b5cf6" font-size="9">Boltz-2</text>

    <rect x="573" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="632" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">score</text>
    <text x="632" y="276" text-anchor="middle" fill="#8b5cf6" font-size="9">Adaption, Llama</text>

    <rect x="705" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#2b3340"/>
    <text x="764" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">rank</text>
    <text x="764" y="276" text-anchor="middle" fill="#6b7280" font-size="9">trade-offs</text>

    <rect x="837" y="236" width="118" height="58" rx="6" fill="#111722" stroke="#1f6feb"/>
    <text x="896" y="259" text-anchor="middle" fill="#e5e7eb" font-size="11">explain</text>
    <text x="896" y="276" text-anchor="middle" fill="#6b7280" font-size="9">the scientist</text>
  </g>
  <g stroke="#3d4654" stroke-width="1.4" fill="none">
    <path d="M163 265 L173 265" marker-end="url(#a)"/>
    <path d="M295 265 L305 265" marker-end="url(#a)"/>
    <path d="M427 265 L437 265" marker-end="url(#a)"/>
    <path d="M559 265 L569 265" marker-end="url(#a)"/>
    <path d="M691 265 L701 265" marker-end="url(#a)"/>
    <path d="M823 265 L833 265" marker-end="url(#a)"/>
  </g>

  <!-- treat, then monitor again -->
  <path d="M896 236 L896 166" stroke="#1f6feb" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="878" y="206" text-anchor="end" fill="#1f6feb" font-size="9">recommend, treat, then ping it again</text>

  <!-- refinement -->
  <path d="M632 300 L632 320 L390 320 L390 300" stroke="#3d4654" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="511" y="336" text-anchor="middle" fill="#4b5261" font-size="9">refinement: round two designs from round one scores</text>

  <!-- ============ 3. provenance ============ -->
  <text x="45" y="376" fill="#4b5261" font-size="11">3 · PROVENANCE</text>
  <g stroke="#2b3340" stroke-width="1" fill="none" opacity="0.85">
    <path d="M104 352 L104 392"/><path d="M236 352 L236 392"/><path d="M368 352 L368 392"/>
    <path d="M500 352 L500 392"/><path d="M632 352 L632 392"/><path d="M764 352 L764 392"/><path d="M896 352 L896 392"/>
  </g>
  <rect x="45" y="392" width="910" height="48" rx="6" fill="#0d1117" stroke="#1f6feb"/>
  <text x="500" y="413" text-anchor="middle" fill="#e5e7eb" font-size="11">run manifest</text>
  <text x="500" y="429" text-anchor="middle" fill="#6b7280" font-size="9">every input, model, version, parameter, score and artefact path, in order. a run replays from this alone</text>

  <g>
    <rect x="45" y="460" width="214" height="34" rx="5" fill="#111722" stroke="#2b3340"/>
    <text x="152" y="481" text-anchor="middle" fill="#6b7280" font-size="10">readings</text>
    <rect x="277" y="460" width="214" height="34" rx="5" fill="#111722" stroke="#2b3340"/>
    <text x="384" y="481" text-anchor="middle" fill="#6b7280" font-size="10">variant sets</text>
    <rect x="509" y="460" width="214" height="34" rx="5" fill="#111722" stroke="#2b3340"/>
    <text x="616" y="481" text-anchor="middle" fill="#6b7280" font-size="10">predicted structures</text>
    <rect x="741" y="460" width="214" height="34" rx="5" fill="#111722" stroke="#2b3340"/>
    <text x="848" y="481" text-anchor="middle" fill="#6b7280" font-size="10">score tables</text>
  </g>
  <text x="500" y="512" text-anchor="middle" fill="#4b5261" font-size="9">artefacts are files. the manifest points at them and never contains them</text>

  <!-- ============ 4. show ============ -->
  <text x="45" y="550" fill="#4b5261" font-size="11">4 · SHOW</text>
  <path d="M500 440 L500 524 L140 524 L140 562" stroke="#3d4654" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <rect x="45" y="566" width="190" height="52" rx="6" fill="#111722" stroke="#2b3340"/>
  <text x="140" y="587" text-anchor="middle" fill="#e5e7eb" font-size="11">api</text>
  <text x="140" y="603" text-anchor="middle" fill="#6b7280" font-size="9">serves, computes nothing</text>

  <path d="M239 592 L271 592" stroke="#3d4654" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="275" y="566" width="680" height="52" rx="6" fill="#111722" stroke="#2b3340"/>
  <text x="615" y="585" text-anchor="middle" fill="#e5e7eb" font-size="11">sonazyme lab</text>
  <text x="615" y="603" text-anchor="middle" fill="#6b7280" font-size="9">act 1 the narrative  ·  act 2 the simulation, in 3d from real predicted structures  ·  act 3 the overhead</text>

  <text x="45" y="652" fill="#4b5261" font-size="10">blue: planned, not built</text>
  <text x="955" y="652" text-anchor="end" fill="#4b5261" font-size="10">every number carries its model. nothing here has been tested in a wet lab</text>
</svg>
